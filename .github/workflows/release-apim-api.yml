name: Release WSO2 APIM API Repository

on:
  workflow_call:
    inputs:
      changed_file:
        type: string
        required: true

env:
  GIT_CICD_REPO: wso2-pipeline
  GIT_CI_BRANCH: main
  GIT_CD_BRANCH: dev
  # INITIAL_VERSION: v1.0
  # MAX_MINOR_VERSION: 9
  GIT_BOT_USERNAME: ${{ secrets.WSO2_GIT_BOT_USERNAME }}
  GIT_BOT_EMAIL: ${{ secrets.WSO2_GIT_BOT_EMAIL }}
  GIT_BOT_PAT: ${{ secrets.WSO2_GIT_BOT_PAT }}

       
jobs:
  validate-properties:
    name: Validate API Properties with Spectral
    uses: apiscoach/wso2-workflows/.github/workflows/validate-properties-spectral.yml@main
    with:
      zip_path: ${{ inputs.changed_file }}
    secrets: inherit

  validate-security:
    name: Validate API Security with Spectral
    uses: apiscoach/wso2-workflows/.github/workflows/validate-security-spectral.yml@main
    with:
      zip_path: ${{ inputs.changed_file }}
    secrets: inherit

  validate-compliance:
    name: Validate API Compliance with apictl
    uses: apiscoach/wso2-workflows/.github/workflows/validate-compliance-apictl.yml@main
    with:
      zip_path: ${{ inputs.changed_file }}
      environment: dev
    secrets: inherit  

  release_apim_api:
    name: Release WSO2 APIM API
    needs: [validate-properties, validate-security, validate-compliance]
    if: always()
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - name: Extract repository name
        run: echo "CURRENT_REPO_NAME=$(echo $GITHUB_REPOSITORY | cut -d '/' -f 2)" >> $GITHUB_ENV

      - name: Get APIM OAuth Token
        if: needs.validate-properties.result == 'failure' || needs.validate-security.result == 'failure' || needs.validate-compliance.result == 'failure'
        id: apim-auth
        uses: apiscoach/wso2-github-actions/get-apim-token@main
        with:
          apim_base_url: ${{ secrets.WSO2_APIM_BASE_URL }}
          admin_username: ${{ secrets.WSO2_APIM_ADMIN_USERNAME }}
          admin_password: ${{ secrets.WSO2_APIM_ADMIN_PASSWORD }}
          client_name: "lifecycle_management_client"
          scopes: "apim:api_publish apim:api_manage apim:api_import_export"

      - name: Change API Lifecycle State to CHANGES_REQUESTED
        if: needs.validate-properties.result == 'failure' || needs.validate-security.result == 'failure' || needs.validate-compliance.result == 'failure'
        run: |
          echo "Validation failed, changing API lifecycle state to CHANGES_REQUESTED"

          # Extract ZIP file to get API details
          TEMP_DIR=$(mktemp -d)
          unzip "${{ inputs.changed_file }}" -d "$TEMP_DIR"

          # Find and read api.yaml file
          API_YAML_FILE=$(find "$TEMP_DIR" -name "api.yaml" -type f | head -1)

          if [ -z "$API_YAML_FILE" ]; then
            echo "Error: api.yaml file not found in ZIP"
            exit 1
          fi

          echo "Found API YAML file: $API_YAML_FILE"

          # Extract API ID from api.yaml
          API_ID=$(yq '.data.id' "$API_YAML_FILE")
          echo "API ID: $API_ID"

          # Validate API ID
          if [ -z "$API_ID" ] || [ "$API_ID" = "null" ]; then
            echo "Error: Could not extract valid API ID from api.yaml"
            rm -rf "$TEMP_DIR"
            exit 1
          fi

          # Debug: Check token availability (first 20 chars only)
          TOKEN_CHECK="${{ steps.apim-auth.outputs.access_token }}"
          if [ -z "$TOKEN_CHECK" ]; then
            echo "Error: Access token is empty"
            rm -rf "$TEMP_DIR"
            exit 1
          fi
          echo "Access token available: ${TOKEN_CHECK:0:20}..."

          # Get current lifecycle state and available actions
          echo "Getting current API lifecycle state..."
          API_INFO=$(curl -s -X GET \
            -H "Authorization: Bearer ${{ steps.apim-auth.outputs.access_token }}" \
            "${{ secrets.WSO2_APIM_BASE_URL }}/api/am/publisher/v4/apis/$API_ID")

          CURRENT_STATE=$(echo "$API_INFO" | jq -r '.lifeCycleStatus')
          echo "Current lifecycle state: $CURRENT_STATE"

          LIFECYCLE_INFO=$(curl -s -X GET \
            -H "Authorization: Bearer ${{ steps.apim-auth.outputs.access_token }}" \
            "${{ secrets.WSO2_APIM_BASE_URL }}/api/am/publisher/v4/apis/$API_ID/lifecycle-state")

          AVAILABLE_ACTIONS=$(echo "$LIFECYCLE_INFO" | jq -r '.availableTransitions[].event')
          echo "Available lifecycle actions:"
          echo "$AVAILABLE_ACTIONS"

          # Change lifecycle state via REST API
          echo ""
          echo "Changing API lifecycle state to CHANGES_REQUESTED..."
          echo "Request URL: ${{ secrets.WSO2_APIM_BASE_URL }}/api/am/publisher/v4/apis/change-lifecycle?apiId=$API_ID&action=Request%20Changes"

          LIFECYCLE_CHANGE_RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ steps.apim-auth.outputs.access_token }}" \
            "${{ secrets.WSO2_APIM_BASE_URL }}/api/am/publisher/v4/apis/change-lifecycle?apiId=$API_ID&action=Request%20Changes")

          HTTP_CODE=$(echo "$LIFECYCLE_CHANGE_RESPONSE" | grep "HTTP_CODE:" | cut -d: -f2)
          RESPONSE_BODY=$(echo "$LIFECYCLE_CHANGE_RESPONSE" | sed '/HTTP_CODE:/d')

          echo "HTTP Status Code: $HTTP_CODE"
          echo "Response Body: $RESPONSE_BODY"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✓ API lifecycle state successfully changed to CHANGES_REQUESTED"
          else
            echo "✗ Failed to change lifecycle state. HTTP Code: $HTTP_CODE"
            echo "Response: $RESPONSE_BODY"
          fi

          # Clean up temp directory
          rm -rf "$TEMP_DIR"
          exit 1

      - name: Fetch PR metadata
        uses: 8BitJonny/gh-get-current-pr@2.1.3
        id: pr

      # Changing logic from original version: in this setup, the ZIP is exported and added to 
      # the repo when the Promote button is clicked in the Publisher UI. We therefore need to release 
      # that file, after validating Spectral rules, custom properties, etc.  
      - name: Detect Changed API Versions
        id: detect_versions
        run: |
          changed_apim_versions=($(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep 'apim/' | cut -f 2 -d '/' | grep -v 'assembly' | grep -v 'pom.xml' | uniq))
          # Join array elements with a delimiter (comma)
          changedApiVersionsStr=$(IFS=,; echo "${changed_apim_versions[*]}")
          echo "changed_apim_versions=${changedApiVersionsStr}" >> $GITHUB_OUTPUT
          echo "changed_apim_versions: ${changedApiVersionsStr}"
      # - name: Zip src folder under repo name
      #   run: |
      #     mkdir -p $CURRENT_REPO_NAME
      #     mv apim $CURRENT_REPO_NAME/
      #     zip -r $CURRENT_REPO_NAME.zip  $CURRENT_REPO_NAME/apim
      - name: Create GitHub Release
        id: release
        run: |
          echo "${{ env.GIT_BOT_PAT }}" | gh auth login --with-token

          # Get the current latest release tag
          currentVersion=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName' || true)

          if [ -z "$currentVersion" ]; then
            newVersion="r1"
          else
            # Strip the 'r' prefix and increment the number
            currentNumber=$(echo "$currentVersion" | sed 's/^r//')
            newNumber=$((currentNumber + 1))
            newVersion="r$newNumber"
          fi

          echo "New version: $newVersion"

          release_notes="Release notes for version $newVersion
          - Pull Request Title: ${{steps.pr.outputs.pr_title}}
          - Pull Request: ${{steps.pr.outputs.pr_url}}
          - Pull Request Merged At: ${{steps.pr.outputs.pr_merged_at}}
          "

          # Create the GitHub release
          gh release create "$newVersion" --title "$CURRENT_REPO_NAME - $newVersion" --notes "$release_notes"

          # Upload the artifact
          echo "Uploading "${{inputs.changed_file}}
          gh release upload "$newVersion" ${{inputs.changed_file}}

          # Output the new version
          echo "NEW_VERSION=$newVersion" >> "$GITHUB_OUTPUT"

      - name: Update Central CD Config
        run: |
          changedApiVersionsStr="${{ steps.detect_versions.outputs.changed_apim_versions }}"

          # Split the string back into an array
          IFS=',' read -ra changed_apim_versions <<< "$changedApiVersionsStr"

          echo "Changed API versions: ${changed_apim_versions[@]}"
          
          mkdir apim-cd
          cd apim-cd

          git config --global user.email "${{ env.GIT_BOT_EMAIL }}"
          git config --global user.name "${{env.GIT_BOT_USERNAME}}"
          git clone https://${{env.GIT_BOT_USERNAME}}:${{ env.GIT_BOT_PAT }}@github.com/${{ github.repository_owner }}/${{env.GIT_CICD_REPO}} --branch ${{env.GIT_CD_BRANCH}} --single-branch
          cd ${{env.GIT_CICD_REPO}}

          for changed_apim_version in "${changed_apim_versions[@]}"; do
            echo "Processing version: $changed_apim_version"
            releaseFilePath="apim/apis/$CURRENT_REPO_NAME/$changed_apim_version/release.json"
            releaseFile=$releaseFilePath

            newVersion=${{ steps.release.outputs.NEW_VERSION }}
            prUrl="${{ steps.pr.outputs.pr_url }}"
            prTitle="${{ steps.pr.outputs.pr_title }}"
            prMergedAt="${{ steps.pr.outputs.pr_merged_at }}"

            if [ -f "$releaseFilePath" ]; then
              echo "Found release file: $releaseFilePath"

              # Read the JSON file and update the details
              updatedReleaseFile=$(jq '
                  .releaseVersion = "'"$newVersion"'" |
                  .pullRequest.url = "'"$prUrl"'" |
                  .pullRequest.title = "'"$prTitle"'" |
                  .pullRequest.mergedAt = "'"$prMergedAt"'"
                ' "$releaseFile")
    
              echo "$updatedReleaseFile" > "$releaseFile"
              git add "$releaseFilePath"
              git commit -m "[CD] [Dev] [APIM-API] [$CURRENT_REPO_NAME-$changed_apim_version] [$newVersion]"
              git push origin ${{env.GIT_CD_BRANCH}}
            else
              echo "Release file not found: $releaseFilePath"
              ZIP_FILENAME=$(basename "${{inputs.changed_file}}")

              branch_name="cd-dev-$CURRENT_REPO_NAME-$changed_apim_version"
              git checkout -b "$branch_name"
              git pull

              mkdir -p "$(dirname "$releaseFilePath")"
          cat <<EOF > "$releaseFilePath"
          {
            "artifactRepository": "${{ github.repository }}",
            "releaseVersion": "$newVersion",
            "artifacts": [
              "$ZIP_FILENAME"
            ],
            "pullRequest": {
              "url": "$prUrl",
              "title": "$prTitle",
              "mergedAt": "$prMergedAt"
            }
          }
          EOF

              commitMsg="[CD] [Dev] [APIM-API] [$CURRENT_REPO_NAME-$changed_apim_version] [$newVersion]"
              prBody="A new API and version have been added to the CI/CD pipeline: $CURRENT_REPO_NAME-$changed_apim_version (Release: $newVersion)
              - This PR was automatically generated to register the new API version in the centralized CD configuration.
              - Merging this PR will approve the addition and trigger deployment to the Dev environment.
              Please review and take action accordingly.
              "

              git add "$releaseFilePath"
              git commit -m "$commitMsg"
              git push -f origin "$branch_name"

              echo "Fetching PRs..."
              echo "$GIT_BOT_PAT" | gh auth login --with-token
              prExists=$(gh pr list --base ${{env.GIT_CD_BRANCH}} --head $branch_name --state OPEN)
              echo "PR exists: $prExists"

              if [ -z "$prExists" ]; then
                echo "PR does not exist. Creating a new PR."
                gh pr create --base ${{env.GIT_CD_BRANCH}} --head $branch_name --title "$commitMsg" --body "$prBody"
              else
                echo "PR already exists. Updating the PR title and body."
                # Extract the PR number using awk
                prNumber=$(echo "$prExists" | awk '{print $1}')
                echo "Existing PR number: $prNumber"
                echo "Temporarily closing the PR due to a bug in gh pr edit - https://github.com/cli/cli/issues/8358"
                gh pr close $prNumber
                # gh pr edit $prNumber --title "$commitMsg" --body "$prBody"
                gh pr create --base ${{env.GIT_CD_BRANCH}} --head $branch_name --title "$commitMsg" --body "$prBody"
              fi
            fi
          done